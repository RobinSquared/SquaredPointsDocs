$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: Squared Points
  structure:
    - type: section
      key: section-1
      title: Home
      path: home
      icon: house-chimney-user
      default: true
      children:
        - type: space
          key: space-1
          title: Landing Page
          path: landing-page
          default: true
          content:
            directory: ./home/landing-page
    - type: section
      key: section-2
      title: Docs
      path: docs
      icon: file-lines
      children:
        - type: space
          key: space-2
          title: Product Docs
          path: product-docs
          default: true
          content:
            directory: ./docs/product-docs
